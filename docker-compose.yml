services:
  db:
    image: postgres:16
    container_name: Human_Detection-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - Human_Detection_pg:/var/lib/postgresql/data

volumes:
  Human_Detection_pg: